chapters:
- id: ch051
  params:
    chapter_num: 51
    chapter_title: 回响
    volume_name: 现实间隙卷_兰亭余波
    genre: 历史悬疑 × 规则怪谈 × 魏晋智斗
    tone: 考据冷硬、现实余震、克制温情与深度心理推演
    target_words: 2300
    voice_sample: assets/voice_sample.md
    chapter_output: 正文/051-间隙章一-回响.md
    chapter_workspace: 工作区/生产任务/production-67f074898275/ch051
  overrides:
    explore_context:
      prompt_append: '本轮是第51—54章从零重写，不复用旧51—54章正文作为本轮产物；大纲末尾“五步流程/第51章微调”是旧执行方案，不具有流程控制权。唯一执行链是当前冻结的十节点模板。

        按《间隙章大纲.md》本章细纲取舍材料。只使用本轮前一章已正式放行的稿件承接，不读取第55章及以后正文、不倒灌后续副本情报；handoff及人物档案包含作者视角秘密时只用于划定盲区，不写入顾君知情。

        受限第三人称固定在顾君可感知范围；白艺内心通过对白、动作与顾君的有限理解表达，不能直接跳进她的脑内。现代通俗白话90%—95%，历史语汇只作必要点缀；心理推演和身体反应有情境依据，禁止机械堆砌。正文目标2000—2500字，对白约25%—40%，长短句因情节自然交替，不全篇切成短碎句。

        张洋称顾君只用老顾/顾子/君儿，战友称谓自然；对创伤中的朋友温和克制，不怒喝闭嘴/给我闭嘴/别废话。禁用“一死生”“齐彭殇”“虚诞”“妄作”。写即时创伤表现，不凭当天症状在叙述中擅自作长期PTSD诊断。

        秦华的暗桩身份、卢夏的敌方身份均是作者层秘密；没有剧情证据不得让主角识破。历史档案中的超自然设定与真实史料分层，物理仪器读数、人物假说、已证实结论分开，不能把磁强计/红外仪能直接测时空曲率或绝对负温写成已证科学能力。

        只写当前节点指定产物，不覆盖旧正文、不改清单结构、不跳过检测或作者审批；正式归档路径保留原文件名，章节正文标题采用新细纲标题。

        本章任务：第一天09:15—17:30。窒息呛醒、手腕淤伤、古墨残片与七个半小时时差；论坛加密私信秦华【关山难越】，确认六人脱困、老莫和苏晚晴静养；探望张洋，发小默契安抚，确立后方休养和论坛监控；傍晚白艺端雪梨银耳汤相迎。古墨松烟香带来的头痛缓解只写主观体验。严禁提前解释玉玺七锚点、雷台、居延和第三副本。

        输出已确证/合理推测/绝对未知三栏表、称谓白名单和输入矛盾清单。只对齐事实，不替后续节点编剧情。'
      inputs_add:
      - 间隙章大纲.md
      - handoff.md
      - 人物小传.md
      - 设定/事实账本/snapshot.json
      - 正文/050-第50章-归朝堂.md

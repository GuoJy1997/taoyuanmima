version: 1
name: volume-taoyuan-code
params:
  volume_num: 3
  volume_pad: '03'
  volume_name: 副本三_张掖将军·马踏飞燕
  genre: 历史悬疑 × 规则怪谈 × 魏晋智斗
  target_chapters: 36
nodes:
  pre_story_recap:
    kind: agent
    role: 前置剧情总结与连贯性红线官
    model_tier: pro
    prompt: |
      你是《桃园密码》的【前置剧情总结与连贯性红线官】。第 {volume_num} 卷（{volume_name}）即将立项，
      你的唯一职责是把"已经写死、不可再改"的既成事实整理成一份连贯性底座，供后续所有剧情节点遵循。
      你不做剧情设计、不提出新桥段——只负责"守住前文"。请通读并交叉比对以下材料后输出：
      1. 【已写剧情全账本】副本一桃花源（Ch1~13）、副本二兰亭祓禊（Ch17~50）、现实间隙卷（Ch51~54）的关键事件、
         生还/伤亡名单、已获得的国宝与门票信物链（枯桃瓣→古墨残片→金石锈片），逐卷列清；
      2. 【角色当前状态锚点】顾君/白艺/秦华/林栩/张洋/老莫/苏晚晴 进入本卷时的既定认知、创伤应激、
         彼此信任度、以及尚未说破的疑点（尤其顾君对秦华的隐疑、白艺被秦华潜移默化引导、张洋 PTSD 留守）；
      3. 【世界观硬约束】退相干规则杀（未显形观测免疫→交互即坍缩致死→仪式完成后显形为凡人肉身）、
         国宝碎片与传国玉玺赌局主线、卢夏（成吉思汗的小马驹）反派暗桩线——这些是物理与剧情铁律，本卷不得违反；
      4. 【连贯性红线清单】逐条列出《副本3设定.md》《副本3故事.md》中任何与上述既成事实冲突、
         时间线错位、人物状态断裂或信物链不接之处，并给出最小改动的修正建议（不改设定内核，只补缝隙）。
      直接输出精炼完整的 Markdown 到指定目标文件。
    inputs:
      - handoff.md
      - world.md
      - 世界观设定.md
      - 人物小传.md
      - relations.md
      - 间隙章大纲.md
      - 伏笔总表.md
      - 伏笔总表2.md
      - 副本2设定.md
      - 副本3设定.md
      - 副本3故事.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_00A_前情总结与连贯性红线.md
    skills:
      - novel-memory-ledger
      - novel-context-curator
    assert:
      min_words: 800

  fact_explorer:
    kind: agent
    role: 事实探索与学术底座官
    model_tier: pro
    prompt: |
      你是《桃园密码》的【事实探索与学术底座官】。本卷是历史悬疑×硬科幻，设定虽架空，但藏在历史与科学深处的
      真实知识必须先被扎实挖出来，后续节点才能在事实之上搭出既合理又惊艳的剧情。你只负责"求真"，不负责"编故事"。
      若当前执行环境具备联网检索能力，请据此核验最新考古与学术结论；若无联网，则基于既有权威知识作答，
      并对每条素材标注可信度分级：L1 确证事实 / L2 主流学术共识 / L3 少数派假说 / L4 未解之谜。
      请围绕本卷内核（东汉建初元年河西走廊·武威雷台·铜奔马"马踏飞燕"·量子退相干暗线）产出四层底座：
      1. 【考古事实层】1969 年武威雷台汉墓出土实况、99 件铜车马仪仗俑、铜奔马形制与命名之争
         （"马踏飞燕/马超龙雀/飞马奔雀"等）、单足力矩平衡的真实铸造工艺与力学、墓主身份的学术争议；
      2. 【历史事实层】东汉建初元年（公元 76 年）西域撤兵诏令、凉州河西军事格局、张掖居延弱水烽燧防线、
         汉匈关系、雷台/姑臧地理——区分正史明载与后世推论；
      3. 【科学事实层】支撑量子暗线的真实物理定律：量子退相干、观测导致的态坍缩、热力学第二定律与熵增、
         孤立系统——讲清每条定律的真实适用边界，指出哪些可作科幻外推的合理支点、哪些属艺术夸张（须自洽）；
      4. 【学术猜测层】基于以上事实，罗列可用于"合理剧情猜测"的历史未解之谜支点与假说，
         只提供"符合逻辑的猜测素材"，不写具体情节。
      直接输出精炼完整的 Markdown 到指定目标文件。
    inputs:
      - world.md
      - 世界观设定.md
      - 副本3设定.md
      - 副本3故事.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_00B_事实与学术底座.md
    skills:
      - novel-context-curator
      - novel-lore-enforcer
    assert:
      min_words: 1000

  volume_premise:
    kind: agent
    after:
      - pre_story_recap
      - fact_explorer
    role: 副本立意与终局定位官
    model_tier: pro
    subagent_type: novel_dungeon_architect
    prompt: |
      你正在为长篇历史悬疑《桃园密码》校验并升华第 {volume_num} 卷（{volume_name}）的大纲立项。
      本卷顶层设计已由创作者裁定并落盘，你的任务不是推翻重来，而是以已定稿文档为最高基准做立意校验、补漏与结构化精炼：
      1. 最高基准（严禁推翻）：时代舞台为东汉建初元年（公元76年）秋、河西走廊张掖居延弱水烽燧线至武威姑臧雷台要塞；精神内核为“绝域孤军弃子悲歌 × 高熵地狱中的逆熵铸序”；终局高光为将军率残卒熔尽残铁铸天马【马踏飞燕】镇压地脉、完成1969年雷台汉墓99件铜车马原位大闭环；
      2. 已裁定阵容：4名入局核心（顾君/白艺/秦华/林栩）+ 4名首发淘汰路人（程浩/郑伟/周斌/赵晓丽，全数阵亡）+ 3名留守现实后方（张洋/老莫/苏晚晴）；
      3. 请比对《outline.md》《world.md》《人物小传.md》《handoff.md》与前置间隙卷（Ch51~54）衔接，输出：本卷核心历史舞台与时空坐标、核心戏剧命题与哲学冲突、主角团队的心智考验与认知蜕变、终局两难裁决的人性拷问；
      4. 顺带核查已定稿文档的内部一致性（例如《副本3设定.md》基础信息表章节跨度“第53~88章”与正文卷实际跨度“第55~90章”的口径矛盾），在报告末尾单列【一致性修正建议】。
      直接输出精炼完整的 Markdown 到指定目标文件。
    inputs:
      - 工作区/分卷策划/第{volume_pad}卷_00A_前情总结与连贯性红线.md
      - 工作区/分卷策划/第{volume_pad}卷_00B_事实与学术底座.md
      - outline.md
      - world.md
      - 人物小传.md
      - handoff.md
      - 间隙章大纲.md
      - 副本3设定.md
      - 副本3故事.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_01_立意与核心命题.md
    skills:
      - novel-plot-architect
      - novel-context-curator
    assert:
      min_words: 400

  dungeon_physics:
    kind: agent
    after:
      - volume_premise
    model_tier: pro
    subagent_type: novel_dungeon_architect
    role: 副本物理法则与生存机制架构师
    prompt: |
      依据《工作区/分卷策划/第{volume_pad}卷_01_立意与核心命题.md》、《world.md》与已定稿《副本3设定.md》，
      运用技能【novel-dungeon-physics】校验并深化第 {volume_num} 卷的【超自然生存物理学蓝图】。
      已裁定机制（严禁推翻，只做自洽性校验与细则补全）：
      1. 表象环境律：河西极旱荒漠、黑风暴、地脉煞气侵蚀；弱因果概率云状态下风沙穿体不伤；
      2. 绝对致死判定律（红线抹杀）：【烽燧因果强观测光锥】内产生非约定时空扰动（现代光源、喧哗干扰军令、搬运未授权物资）→ 触发【热力学孤立系微观极速熵增】瞬间脱水沙化；程浩之死即首例演示；
      3. 生门兑现契约：绝非杀光黄鬼，而是协助将军完成铜奔马熔铸与调平、以【马踏飞燕单足超绝力矩逆熵平衡】镇压地脉天元点，开启通往下层汉墓的生门隧道；
      4. 破局剪刀前置伪装：白艺的便携物理探测套件（间隙卷 Ch54 已开箱）与古墨残片墨香（克制黄鬼）须在开局前 3 章以日常细节伪装登场；
      5. 代价守恒：秦华左臂遭黄鬼沙化重创、林栩投入 48 克钛合金军牌熔接定乾坤、4 名路人全数阵亡——校验每条代价的不可逆性与因果链闭合；
      6. 显形机制：唯有将军登台拔剑、宣读军令、全军歃血誓师时，全员因果闭环显形为“绝域士卒”。
      输出补全后的完整物理学蓝图（含判定边界、例外情形、与黄鬼机制的耦合细则）。
    inputs:
      - 工作区/分卷策划/第{volume_pad}卷_01_立意与核心命题.md
      - 工作区/分卷策划/第{volume_pad}卷_00B_事实与学术底座.md
      - world.md
      - 副本3设定.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_02_副本物理与生存法则.md
    skills:
      - novel-dungeon-physics
      - novel-lore-enforcer
    assert:
      min_words: 600

  faction_agenda_matrix:
    kind: agent
    after:
      - dungeon_physics
    model_tier: pro
    subagent_type: novel_faction_schemer
    role: 多方势力博弈与阴谋精算师
    prompt: |
      依据《工作区/分卷策划/第{volume_pad}卷_02_副本物理与生存法则.md》、《人物小传.md》与已定稿《副本3设定.md》，
      运用技能【novel-faction-schemer】校验并深化本卷【多极势力动态博弈与暗算盘总账】。
      已裁定四方生态位（严禁推翻）：
      1. 雷台将军（守张掖长）：早知自己是弃子，铸马镇地脉、死后化阴兵永镇河西；
      2. 铁匠副官程延（卢夏东汉祖先线）：铜液掺硅砂破坏力矩配比、凿排气暗道引黄鬼入炉，终局被顾君以物料收支代码逻辑揪出；
      3. 秦华（现代反派顶级深潜）：恪守卢夏“绝不擅动、全力潜伏”密令，舍身救白艺、协助制伏程延，信任度刷至 100%，疑点压至副本 6-8；
      4. 匈奴与黄鬼先锋：地脉煞气驱使的无意识毁灭傀儡。
      你的任务：测算各方背叛阈值与合纵连横路径；排布程延破坏线与顾君排障反制的递归博弈树（借刀杀人须具备完全可否认性）；设计终局高炉对决的妥协泄压与代价分配；核查“秦华深潜不暴露”与“程延独自执行破坏”两条暗线的防剧透隔离是否严密。
    inputs:
      - 工作区/分卷策划/第{volume_pad}卷_02_副本物理与生存法则.md
      - 工作区/分卷策划/第{volume_pad}卷_00B_事实与学术底座.md
      - 人物小传.md
      - relations.md
      - 副本3设定.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_03_势力暗算盘与博弈矩阵.md
    skills:
      - novel-faction-schemer
      - novel-character-guardian
    assert:
      min_words: 600

  revelation_ladder:
    kind: agent
    after:
      - faction_agenda_matrix
    model_tier: pro
    subagent_type: novel_faction_schemer
    role: 反转链与认知阶梯设计官
    prompt: |
      综合副本生存法则、多方暗算盘与已定稿《副本3故事.md》，运用技能【story-suspense-investigation】，
      校验并细化整卷由浅入深的【四阶认知反转阶梯 (Revelation Ladder)】：
      - 阶梯 ①：【表象误读】（主角团以为只是极旱荒漠求生与匈奴袭扰）；
      - 阶梯 ②：【线索破损】（旧模型破产，发现致命真凶是看不见的熵增脱水规则与烽燧光锥）；
      - 阶梯 ③：【灾变爆发】（黑风暴围城、高炉被破坏、伪装撕下、路人接连规则杀）；
      - 阶梯 ④：【终极掀桌与大裁决】（程延暗桩浮出水面，顾君揪出破坏者，全营熔铸天马逆熵镇地脉）。
      每一级阶梯必须明确“对应的具体章节范围（Ch55~90）”、“推翻的旧假设”与“颠覆后的新认知”，并与已裁定减员时点（程浩 Ch58 / 郑伟 Ch61 / 周斌 Ch67 / 赵晓丽 Ch69）对齐。
    inputs:
      - 工作区/分卷策划/第{volume_pad}卷_02_副本物理与生存法则.md
      - 工作区/分卷策划/第{volume_pad}卷_03_势力暗算盘与博弈矩阵.md
      - 工作区/分卷策划/第{volume_pad}卷_00A_前情总结与连贯性红线.md
      - 副本3故事.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_04_四阶认知反转链.md
    skills:
      - story-suspense-investigation
      - novel-plot-architect
    assert:
      min_words: 500

  pacing_beats:
    kind: agent
    after:
      - revelation_ladder
    model_tier: flash
    subagent_type: novel_chapter_writer
    role: 三幕节拍器与逐章细纲架构师
    prompt: |
      依据【认知反转阶梯】、【势力博弈网】与已定稿《副本3故事.md》《间隙章大纲.md》，
      将本卷（Ch55~90，共 {target_chapters} 章，河西绝域要塞三天两夜生死倒计时）校验并细化为【逐章骨架细纲矩阵】。
      已裁定锚点（严禁改动）：间隙卷 Ch54 结尾因果引力阱爆发坠入大漠 → Ch55 血色孤烟入局；程浩 Ch58 强光干涉光锥首例脱水规则杀；郑伟 Ch61 偷喝卤井毒水暴毙；周斌 Ch67 黑风暴脱队被黄鬼撕裂；赵晓丽 Ch69 听觉幻觉受戮；终局熔铸马踏飞燕镇压地脉、生门通往下层汉墓，带出铜奔马真迹与【金石锈片】（指向副本4法门寺佛骨）。
      每章包含：1. 章节序号与标题建议；2. 核心矛盾推进点；3. 出场人物与知情视界状态（知情视界三栏边界预置，严守秦华暗桩防剧透隔离）；4. 章节结尾悬念钩子（短/中/长期待）。
      同时核查已定稿逐章细纲与上述锚点是否逐章对齐，偏差处单列【修正建议】。
    inputs:
      - 工作区/分卷策划/第{volume_pad}卷_04_四阶认知反转链.md
      - 工作区/分卷策划/第{volume_pad}卷_03_势力暗算盘与博弈矩阵.md
      - 工作区/分卷策划/第{volume_pad}卷_02_副本物理与生存法则.md
      - 工作区/分卷策划/第{volume_pad}卷_00A_前情总结与连贯性红线.md
      - 副本3故事.md
      - 间隙章大纲.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_05_逐章细纲矩阵.md
    skills:
      - novel-plot-architect
      - novel-scene-pacing
      - story-suspense-investigation
    assert:
      min_words: 1000

  clue_ledger_sync:
    kind: agent
    after:
      - pacing_beats
    model_tier: pro
    subagent_type: novel_qc_reviewer
    role: 伏笔总账同步与审查员
    prompt: |
      对照《第{volume_pad}卷_05_逐章细纲矩阵.md》与已定稿《伏笔总表3.md》，运用技能【novel-clue-foreshadowing】，
      核查并输出本卷完整的【伏笔生命周期总账】：
      1. 严格区分【卷内闭环短线伏笔】（如钛合金军牌、卤井煞毒、墨香克鬼）与【跨卷战略长线暗桩】（秦华深潜、卢夏引导、金石锈片指向副本4）；
      2. 检查每条短线伏笔是否满足“播种-发酵-锁紧-回收”完整闭环，严禁丢线；
      3. 检查跨卷暗桩是否做好保密与防剧透隔离（秦华暗桩疑点压至副本 6-8，严禁本卷任何角色识破）；
      4. 登记入库，输出完整的《第{volume_pad}卷_06_伏笔生命周期总账.md》。
    inputs:
      - 工作区/分卷策划/第{volume_pad}卷_05_逐章细纲矩阵.md
      - 伏笔总表3.md
    outputs:
      - 工作区/分卷策划/第{volume_pad}卷_06_伏笔生命周期总账.md
    skills:
      - novel-clue-foreshadowing
      - novel-memory-ledger
    assert:
      min_words: 400

  author_accept:
    kind: human
    after:
      - clue_ledger_sync
